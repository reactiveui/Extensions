# Throwaway DEBUG workflow: prove we can log into Certum SimplySign Desktop
# headlessly on a Linux runner and expose the cloud signing token via PKCS#11.
#
# This is an iteration harness, NOT a release path. It launches the SimplySign
# Desktop GUI under Xvfb, drives the login dialog with xdotool using the OTP we
# derive from CERTUM_OTP_URI, and dumps heavy diagnostics + screenshots as
# artifacts so we can see exactly what the app is doing on the runner.
#
# Secrets used (already configured in this repo):
#   CERTUM_USER_ID  - SimplySign login id
#   CERTUM_OTP_URI  - otpauth:// URI (SHA256/6/30) we turn into the OTP
name: Certum Linux SimplySign debug

on:
  workflow_dispatch:
    inputs:
      simplysign_bin_url:
        description: 'SimplySign Desktop Linux .bin installer URL'
        required: true
        default: 'https://files.certum.eu/software/SimplySignDesktop/Linux-Ubuntu/2.9.14-9.4.3.0/SimplySignDesktop-2.9.14-9.4.3.0-x86_64-prod-ubuntu.bin'
      launch_seconds:
        description: 'How long to wait after launching the app before driving the UI'
        required: false
        default: '20'

permissions:
  contents: read

jobs:
  certum-debug:
    runs-on: ubuntu-latest
    environment:
      name: release
    env:
      DISPLAY: ':99'
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      SS_BIN_URL: ${{ inputs.simplysign_bin_url }}
      LAUNCH_SECONDS: ${{ inputs.launch_seconds }}
    steps:
      - name: Install desktop + X + PKCS#11 tooling
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils xdotool wmctrl fluxbox imagemagick \
            p11-kit p11-kit-modules opensc-pkcs11 oathtool \
            libx11-6 libxext6 libxcomposite1 libxi6 libice6 libsm6 libxrender1 \
            libxcb1 libxau6 libpcsclite1 libglx-mesa0 libgl1 libxslt1.1 \
            libxkbcommon0 libxcb-xinerama0 libfontconfig1 libdbus-1-3 procps curl

      - name: Download + install SimplySign Desktop
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o ss.bin "$SS_BIN_URL"
          ls -la ss.bin
          # makeself-style self-extracting installer; answer prompts with "yes"
          yes yes | sh ss.bin --target "$HOME/certum" || true
          echo "=== extracted tree ==="
          find "$HOME/certum" -maxdepth 2 | head -100
          echo "=== locate dist dir / binary / pkcs11 module ==="
          DIST="$(find "$HOME/certum" -maxdepth 1 -type d -name 'SSD-*-dist' | head -1)"
          echo "DIST=$DIST"
          find "$HOME/certum" -name 'SimplySignDesktop' -type f
          find "$HOME/certum" -name 'SimplySignPKCS*.so'
          {
            echo "SS_DIST=$DIST"
            echo "SS_EXE=$(find "$HOME/certum" -name 'SimplySignDesktop' -type f | head -1)"
            echo "SS_PKCS11=$(find "$HOME/certum" -name 'SimplySignPKCS*.so' | head -1)"
          } >> "$GITHUB_ENV"

      - name: Start Xvfb + window manager
        run: |
          set -euxo pipefail
          Xvfb :99 -screen 0 1280x1024x24 >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          sleep 3
          fluxbox >"$RUNNER_TEMP/fluxbox.log" 2>&1 &
          sleep 2
          xdpyinfo >/dev/null && echo "X display :99 is up"

      - name: Launch SimplySign Desktop
        run: |
          set -euxo pipefail
          test -n "${SS_EXE:-}" || { echo "SimplySignDesktop binary not found"; exit 1; }
          echo "Launching $SS_EXE"
          "$SS_EXE" >"$RUNNER_TEMP/simplysign.log" 2>&1 &
          echo "SS_PID=$!" >> "$GITHUB_ENV"
          sleep "${LAUNCH_SECONDS}"
          import -window root "$RUNNER_TEMP/01-after-launch.png" || true

      - name: Diagnose windows / processes
        run: |
          set -uxo pipefail
          echo "=== ps (certum/simplysign) ==="; ps aux | grep -i -E 'simplysign|certum' | grep -v grep || true
          echo "=== wmctrl -lx ==="; wmctrl -lx || true
          echo "=== xdotool window list with names ==="
          for w in $(xdotool search --name '' 2>/dev/null); do
            printf 'win=%s name=%q class=%s\n' "$w" "$(xdotool getwindowname "$w" 2>/dev/null)" "$(xprop -id "$w" WM_CLASS 2>/dev/null | sed 's/.*= //')"
          done || true
          echo "=== search by SimplySign ==="; xdotool search --name -i 'simplysign' || true

      - name: Generate OTP and drive login
        run: |
          set -uxo pipefail
          # Derive the current OTP from the otpauth URI (honours SHA256/digits/period).
          OTP="$(python3 - <<'PY'
          import os,hmac,hashlib,base64,struct,time
          from urllib.parse import urlparse,parse_qs
          q=parse_qs(urlparse(os.environ["CERTUM_OTP_URI"]).query)
          secret=q["secret"][0]
          digits=int(q.get("digits",["6"])[0]); period=int(q.get("period",["30"])[0])
          algo={"SHA1":hashlib.sha1,"SHA256":hashlib.sha256,"SHA512":hashlib.sha512}[q.get("algorithm",["SHA1"])[0].upper()]
          key=base64.b32decode(secret+"="*((8-len(secret)%8)%8))
          msg=struct.pack(">Q",int(time.time()//period))
          h=hmac.new(key,msg,algo).digest(); o=h[-1]&0xF
          print(str(((int.from_bytes(h[o:o+4],"big")&0x7fffffff))%(10**digits)).zfill(digits))
          PY
          )"
          echo "::add-mask::$OTP"
          echo "Generated OTP (masked)."

          # Try to focus the SimplySign window; iterate on these selectors as we learn.
          WID="$(xdotool search --name -i 'simplysign' | head -1 || true)"
          [ -z "$WID" ] && WID="$(xdotool search --class -i 'simplysign' | head -1 || true)"
          echo "WID=$WID"
          if [ -n "$WID" ]; then
            xdotool windowactivate --sync "$WID" || true
            xdotool windowfocus "$WID" || true
          fi
          import -window root "$RUNNER_TEMP/02-login-window.png" || true

          # Best-effort credential entry — exact field order/tabs TBD from screenshots.
          xdotool type --clearmodifiers --delay 60 "$CERTUM_USER_ID" || true
          xdotool key Tab || true
          sleep 1
          xdotool type --clearmodifiers --delay 60 "$OTP" || true
          import -window root "$RUNNER_TEMP/03-filled.png" || true
          xdotool key Return || true
          sleep 8
          import -window root "$RUNNER_TEMP/04-after-submit.png" || true

      - name: Probe PKCS#11 token
        run: |
          set -uxo pipefail
          echo "SS_PKCS11=${SS_PKCS11:-<none>}"
          if [ -n "${SS_PKCS11:-}" ]; then
            echo "=== list slots via SimplySign module directly ==="
            pkcs11-tool --module "$SS_PKCS11" -L || true
            echo "=== list objects ==="
            pkcs11-tool --module "$SS_PKCS11" -O || true
          fi
          import -window root "$RUNNER_TEMP/05-final.png" || true

      - name: Collect logs
        if: always()
        run: |
          set -uxo pipefail
          mkdir -p "$RUNNER_TEMP/diag"
          cp "$RUNNER_TEMP"/*.png "$RUNNER_TEMP/diag/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/diag/" 2>/dev/null || true
          cp -r "$HOME/.config" "$RUNNER_TEMP/diag/dotconfig" 2>/dev/null || true
          find "$HOME/certum" -name '*.log' -exec cp {} "$RUNNER_TEMP/diag/" \; 2>/dev/null || true
          ls -la "$RUNNER_TEMP/diag" || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certum-debug-diag
          path: ${{ runner.temp }}/diag
          if-no-files-found: warn
